<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Royal Wedding Invitation | Groom Weds Bride</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts matching the exact reference typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Great+Vibes&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- External Configuration File containing all text, links, and assets/ image paths -->
  <script src="config.js"></script>

  <style>
    :root {
      --crimson-script: #c82344;
      --gold-script: #d89b28;
      --navy-header: #1a3356;
      --orange-date: #d84b28;
      --magenta-venue: #b51a58;
      --arch-brown: #8b3e19;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      background: radial-gradient(circle at center, #ece9e6 0%, #d5d0cd 100%);
      min-height: 100vh;
      display: flex;
       flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* Typography Classes */
    .font-script-names {
      font-family: 'Great Vibes', cursive;
    }
    .font-script-gold {
      font-family: 'Alex Brush', cursive;
    }
    .font-serif-weds {
      font-family: 'Cormorant Garamond', serif;
    }

    /* Desktop Phone Bezel vs Mobile Fullscreen */
    .phone-outer-frame {
      position: relative;
      width: 100%;
      max-width: 405px;
      height: 855px;
      background: #141414;
      border-radius: 54px;
      padding: 13px;
      box-shadow:
        0 30px 70px rgba(0, 0, 0, 0.42),
        0 0 0 2px #3a3a3a,
        inset 0 0 8px rgba(255, 255, 255, 0.22);
      transition: all 0.3s ease;
    }

    /* Side buttons on desktop bezel */
    .bezel-btn-left-1 {
      position: absolute;
      left: -4px;
      top: 120px;
      width: 4px;
      height: 32px;
      background: #2b2b2b;
      border-radius: 4px 0 0 4px;
    }
    .bezel-btn-left-2 {
      position: absolute;
      left: -4px;
      top: 170px;
      width: 4px;
      height: 58px;
      background: #2b2b2b;
      border-radius: 4px 0 0 4px;
    }
    .bezel-btn-left-3 {
      position: absolute;
      left: -4px;
      top: 240px;
      width: 4px;
      height: 58px;
      background: #2b2b2b;
      border-radius: 4px 0 0 4px;
    }
    .bezel-btn-right {
      position: absolute;
      right: -4px;
      top: 190px;
      width: 4px;
      height: 85px;
      background: #2b2b2b;
      border-radius: 0 4px 4px 0;
    }

    /* Notch */
    .phone-notch {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 168px;
      height: 27px;
      background: #141414;
      border-bottom-left-radius: 18px;
      border-bottom-right-radius: 18px;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .phone-notch-speaker {
      width: 42px;
      height: 5px;
      background: #292929;
      border-radius: 4px;
    }
    .phone-notch-cam {
      width: 9px;
      height: 9px;
      background: radial-gradient(circle, #1e3a8a 20%, #0f172a 70%);
      border-radius: 50%;
      border: 1.5px solid #2b2b2b;
    }

    /* Inner Screen Viewport */
    .phone-screen {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 42px;
      overflow: hidden;
      background: linear-gradient(180deg, #b6e2ff 0%, #daf0ff 30%, #eef8ff 58%, #ffffff 82%);
      box-shadow: inset 0 0 18px rgba(139, 62, 25, 0.08);
    }

    @media (max-width: 450px) {
      body {
        background: #eef8ff;
        padding: 0;
      }
      .phone-outer-frame {
        max-width: 100vw;
        width: 100vw;
        height: 100dvh;
        border-radius: 0;
        padding: 0;
        box-shadow: none;
        background: transparent;
      }
      .phone-notch,
      .bezel-btn-left-1,
      .bezel-btn-left-2,
      .bezel-btn-left-3,
      .bezel-btn-right {
        display: none;
      }
      .phone-screen {
        border-radius: 0;
      }
    }

    /* Animations for Hanging Lamps (Pendulum Swing & Glow Flicker) */
    @keyframes swingLeftLamp {
      0%, 100% { transform: rotate(-3.2deg); }
      50% { transform: rotate(3.2deg); }
    }
    @keyframes swingRightLampHigh {
      0%, 100% { transform: rotate(2.6deg); }
      50% { transform: rotate(-2.8deg); }
    }
    @keyframes swingRightLampLow {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(3.6deg); }
    }
    @keyframes lanternGlow {
      0%, 100% { opacity: 0.85; transform: scale(0.96); }
      50% { opacity: 1; transform: scale(1.12); }
    }

    .lamp-swing-1 {
      transform-origin: 60px 195px;
      animation: swingLeftLamp 4.2s ease-in-out infinite;
    }
    .lamp-swing-2 {
      transform-origin: 342px 195px;
      animation: swingRightLampHigh 3.7s ease-in-out infinite;
    }
    .lamp-swing-3 {
      transform-origin: 378px 285px;
      animation: swingRightLampLow 4.8s ease-in-out infinite;
    }
    .flame-flicker {
      transform-box: fill-box;
      transform-origin: center;
      animation: lanternGlow 1.9s ease-in-out infinite alternate;
    }

    /* Animations for Birds & Blossom Branch */
    @keyframes birdTopBob {
      0%, 100% { transform: rotate(0deg) translateY(0px); }
      35% { transform: rotate(4deg) translateY(-1.5px); }
      70% { transform: rotate(-2deg) translateY(0.5px); }
    }
    @keyframes birdBottomHop {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(1.5px, -2.5px) rotate(-3.5deg); }
      60% { transform: translate(-1px, 0px) rotate(2.5deg); }
    }
    @keyframes wingFlutter {
      0%, 82%, 100% { transform: rotate(0deg); }
      86% { transform: rotate(-14deg); }
      90% { transform: rotate(6deg); }
      94% { transform: rotate(-12deg); }
    }
    @keyframes branchSway {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(1.3deg); }
    }

    .branch-group {
      transform-origin: 0px 360px;
      animation: branchSway 6s ease-in-out infinite;
    }
    .bird-1-anim {
      transform-box: fill-box;
      transform-origin: center;
      animation: birdTopBob 3.6s ease-in-out infinite;
    }
    .bird-2-anim {
      transform-box: fill-box;
      transform-origin: center;
      animation: birdBottomHop 4.1s ease-in-out infinite;
    }
    .bird-wing-anim {
      transform-box: fill-box;
      transform-origin: left center;
      animation: wingFlutter 3.2s ease-in-out infinite;
    }

    /* Peacock & Floral Animations */
    @keyframes peacockBreath {
      0%, 100% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(-1.2deg) scale(1.015); }
    }
    @keyframes roseGentleBreeze {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.02) rotate(0.8deg); }
    }

    .peacock-anim {
      transform-origin: 350px 580px;
      animation: peacockBreath 5s ease-in-out infinite;
    }
    .arch-roses-anim {
      transform-origin: 200px 60px;
      animation: roseGentleBreeze 7s ease-in-out infinite;
    }

    /* Clickable Name Hover & Pulse Effects */
    @keyframes gentlePulseRing {
      0%, 100% { transform: scale(1); box-shadow: 0 2px 10px rgba(200, 35, 68, 0.12); }
      50% { transform: scale(1.03); box-shadow: 0 4px 16px rgba(200, 35, 68, 0.26); }
    }
    .name-interactive {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.2s ease;
    }
    .name-interactive:hover {
      transform: scale(1.07);
      color: #a31532;
    }
    .name-interactive:active {
      transform: scale(0.96);
    }

    /* Cute Date Reveal Ribbon Animation */
    @keyframes floatSeal {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-3px) scale(1.02); }
    }
    @keyframes shimmerSweep {
      0% { transform: translateX(-120%) skewX(-20deg); }
      100% { transform: translateX(220%) skewX(-20deg); }
    }
    .date-cover-card {
      animation: floatSeal 3s ease-in-out infinite;
      overflow: hidden;
    }
    .date-cover-shimmer::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.65), transparent);
      animation: shimmerSweep 2.8s infinite;
    }

    /* Soundwave Equalizer Bars */
    @keyframes eqBar1 { 0%, 100% { height: 4px; } 50% { height: 13px; } }
    @keyframes eqBar2 { 0%, 100% { height: 12px; } 40% { height: 4px; } 80% { height: 14px; } }
    @keyframes eqBar3 { 0%, 100% { height: 6px; } 60% { height: 13px; } }

    .eq-bar-1 { animation: eqBar1 0.8s ease-in-out infinite; }
    .eq-bar-2 { animation: eqBar2 0.7s ease-in-out infinite; }
    .eq-bar-3 { animation: eqBar3 0.9s ease-in-out infinite; }

    /* Perspective Marble Floor matches reference image exactly */
    .marble-floor-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 120px;
      overflow: hidden;
      background: #fdfbf7;
      z-index: 8;
    }

    /* Custom Scrollbar for Venue Page & Drawer */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body>

  <!-- Outer iPhone Bezel Container -->
  <div class="phone-outer-frame">
    <!-- Bezel Hardware Buttons -->
    <div class="bezel-btn-left-1"></div>
    <div class="bezel-btn-left-2"></div>
    <div class="bezel-btn-left-3"></div>
    <div class="bezel-btn-right"></div>

    <!-- Top Notch -->
    <div class="phone-notch">
      <div class="phone-notch-cam"></div>
      <div class="phone-notch-speaker"></div>
    </div>

    <!-- Main Mobile Screen -->
    <div class="phone-screen" id="phoneScreen">

      <!-- =========================================================
           1. FULL-SCREEN GLITTER & FAIRY DUST CANVAS OVERLAY
           ========================================================= -->
      <canvas id="glitterCanvas" class="pointer-events-none absolute inset-0 z-30 w-full h-full"></canvas>

      <!-- =========================================================
           2. FLOATING TOP CONTROL (CALM BACKGROUND MUSIC ONLY)
           ========================================================= -->
      <div class="absolute top-3 left-3 right-3 z-40 flex items-center justify-end pointer-events-none">
        <!-- Calm Background Music Button -->
        <button
          id="musicToggleBtn"
          onclick="toggleCalmMusic()"
          title="Toggle Calm Wedding Music"
          class="pointer-events-auto flex items-center gap-1.5 px-2.5 py-1.5 rounded-full bg-white/80 hover:bg-white backdrop-blur-md shadow-md border border-rose-700/20 text-[10px] font-semibold text-rose-900 transition active:scale-95"
        >
          <div id="musicBars" class="flex items-end gap-[2px] h-3.5 w-3.5 justify-center">
            <span class="w-[2.5px] bg-rose-600 rounded-full h-1.5 transition-all" id="bar1"></span>
            <span class="w-[2.5px] bg-rose-600 rounded-full h-2.5 transition-all" id="bar2"></span>
            <span class="w-[2.5px] bg-rose-600 rounded-full h-1 transition-all" id="bar3"></span>
          </div>
          <span id="musicStatusText">Music Off</span>
        </button>
      </div>

      <!-- =========================================================
           3. MAIN INVITATION PAGE (EXACT REPLICA OF IMAGE)
           ========================================================= -->
      <div id="invitationView" class="relative w-full h-full overflow-hidden select-none transition-all duration-500">

        <!-- MASTER BACKGROUND & ORNATE ARTWORK SVG LAYER -->
        <svg
          class="

          absolute inset-0 w-full h-full pointer-events-none z-10"
          viewBox="0 0 400 840"
          preserveAspectRatio="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <defs>
            <!-- Soft Watercolor Blush Pink Spandrels (Above the Arch) -->
            <linearGradient id="pinkSpandrelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fde4ea" />
              <stop offset="50%" stop-color="#fad4de" />
              <stop offset="100%" stop-color="#fce8ef" />
            </linearGradient>

            <!-- Ornate Palace Arch Brown Gradient -->
            <linearGradient id="archBrownGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#7c3211" />
              <stop offset="25%" stop-color="#9c481f" />
              <stop offset="50%" stop-color="#833815" />
              <stop offset="75%" stop-color="#9c481f" />
              <stop offset="100%" stop-color="#752e0f" />
            </linearGradient>

            <!-- Lantern Copper/Bronze Metallic Gradient -->
            <linearGradient id="copperMetal" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#5d2914" />
              <stop offset="35%" stop-color="#a85a32" />
              <stop offset="55%" stop-color="#ca7b4b" />
              <stop offset="80%" stop-color="#7e3b1d" />
              <stop offset="100%" stop-color="#4a1e0c" />
            </linearGradient>

            <!-- Lantern Glass Inner Warm Flame Gradient -->
            <radialGradient id="lanternFlame" cx="50%" cy="62%" r="55%">
              <stop offset="0%" stop-color="#fffef2" />
              <stop offset="30%" stop-color="#ffe082" />
              <stop offset="65%" stop-color="#f57c00" stop-opacity="0.85" />
              <stop offset="100%" stop-color="#8d3815" stop-opacity="0.2" />
            </radialGradient>

            <!-- Outer Lantern Halo Glow -->
            <radialGradient id="lanternHalo" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#ffcc66" stop-opacity="0.65" />
              <stop offset="60%" stop-color="#ff9933" stop-opacity="0.2" />
              <stop offset="100%" stop-color="#ff9933" stop-opacity="0" />
            </radialGradient>

            <!-- Deep Red Rose Gradient -->
            <radialGradient id="crimsonRoseGrad" cx="40%" cy="40%" r="60%">
              <stop offset="0%" stop-color="#ff4d6d" />
              <stop offset="45%" stop-color="#c9184a" />
              <stop offset="85%" stop-color="#800f2f" />
              <stop offset="100%" stop-color="#590d22" />
            </radialGradient>

            <!-- Blush Pink Rose Gradient -->
            <radialGradient id="pinkRoseGrad" cx="35%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#fff0f3" />
              <stop offset="40%" stop-color="#ff8fa3" />
              <stop offset="80%" stop-color="#e05772" />
              <stop offset="100%" stop-color="#a4133c" />
            </radialGradient>

            <!-- Cream White Rose Gradient -->
            <radialGradient id="creamRoseGrad" cx="40%" cy="40%" r="60%">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="55%" stop-color="#fff3d6" />
              <stop offset="90%" stop-color="#e6ccb2" />
              <stop offset="100%" stop-color="#c9ada7" />
            </radialGradient>

            <!-- Reusable Detailed Rose Component -->
            <g id="crimsonRose">
              <circle cx="0" cy="0" r="16" fill="url(#crimsonRoseGrad)" />
              <path d="M-10,-6 C-4,-15 8,-14 12,-4 C15,5 6,14 -5,12 C-14,10 -15,-2 -7,-8" fill="none" stroke="#ff758f" stroke-width="1.3" opacity="0.75"/>
              <path d="M-6,-2 C-2,-8 6,-7 8,0 C9,6 2,9 -4,7 C-8,5 -7,-2 -2,-4" fill="#a4133c" stroke="#ffb3c1" stroke-width="1" />
              <circle cx="0" cy="0" r="2.5" fill="#ffb3c1" opacity="0.8" />
            </g>

            <g id="pinkRose">
              <circle cx="0" cy="0" r="18" fill="url(#pinkRoseGrad)" />
              <path d="M-12,-5 C-5,-16 10,-15 14,-3 C16,7 6,16 -6,14 C-15,11 -16,-2 -8,-9" fill="none" stroke="#ffe5ec" stroke-width="1.5" opacity="0.85"/>
              <path d="M-7,-3 C-1,-10 7,-8 9,0 C10,7 2,10 -5,8 C-9,6 -8,-3 -3,-5" fill="#ff758f" stroke="#fff0f3" stroke-width="1.1" />
              <circle cx="-1" cy="-1" r="3" fill="#fff0f3" />
            </g>

            <g id="creamRose">
              <circle cx="0" cy="0" r="12" fill="url(#creamRoseGrad)" />
              <path d="M-7,-3 C-2,-10 6,-9 8,-2 C9,4 3,9 -4,8 C-9,6 -9,-2 -4,-5" fill="none" stroke="#d4a373" stroke-width="1" opacity="0.6"/>
              <circle cx="0" cy="0" r="3" fill="#faedcd" />
            </g>

            <!-- Reusable Green Leaf Pair -->
            <g id="roseLeaves">
              <path d="M0,0 Q14,-12 26,-4 Q14,8 0,0 Z" fill="#3a6b35" stroke="#244721" stroke-width="0.7" />
              <path d="M0,0 Q13,-5 23,-4" fill="none" stroke="#76a063" stroke-width="0.8" />
              <path d="M0,0 Q8,14 20,16 Q16,2 0,0 Z" fill="#4f8342" stroke="#2d5426" stroke-width="0.7" />
            </g>

            <!-- Reusable Cherry Blossom Flower -->
            <g id="cherryBlossom">
              <circle cx="0" cy="-5" r="4.2" fill="#ffb3c6" />
              <circle cx="4.8" cy="-1.5" r="4.2" fill="#ffc2d1" />
              <circle cx="3" cy="4" r="4.2" fill="#ffb3c6" />
              <circle cx="-3" cy="4" r="4.2" fill="#ffc2d1" />
              <circle cx="-4.8" cy="-1.5" r="4.2" fill="#ff8fab" />
              <circle cx="0" cy="0" r="2.2" fill="#fb5607" />
            </g>

            <!-- Reusable Hanging Bronze Lantern -->
            <g id="hangingLantern">
              <!-- Outer Warm Glow -->
              <circle cx="0" cy="48" r="34" fill="url(#lanternHalo)" class="flame-flicker" />
              <!-- Top Ring -->
              <circle cx="0" cy="4" r="3.5" fill="none" stroke="#6c3017" stroke-width="1.5" />
              <!-- Dome Cap -->
              <path d="M-9,14 Q0,4 9,14 L15,22 L-15,22 Z" fill="url(#copperMetal)" />
              <rect x="-16" y="21" width="32" height="2.5" rx="1" fill="#4a1e0c" />
              <!-- Glass Body -->
              <path d="M-14,23.5 L14,23.5 L15,66 Q0,72 -15,66 Z" fill="url(#lanternFlame)" stroke="#5d2914" stroke-width="1.5" />
              <!-- Inner Bright Flame -->
              <ellipse cx="0" cy="54" rx="8" ry="11" fill="#fffbeb" opacity="0.9" class="flame-flicker" />
              <!-- Vertical Bronze Ribs -->
              <path d="M-7,23.5 L-7.5,67 M7,23.5 L7.5,67" stroke="#5d2914" stroke-width="1.3" opacity="0.85" />
              <!-- Bottom Base Cup & Finial -->
              <path d="M-15,65 L15,65 L10,74 L-10,74 Z" fill="url(#copperMetal)" />
              <path d="M-4,74 L4,74 L0,81 Z" fill="#4a1e0c" />
            </g>

            <!-- Soft Drop Shadow Filter -->
            <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#3d1e10" flood-opacity="0.22" />
            </filter>
          </defs>

          <!-- =======================================================
               A. HANGING LANTERNS (Behind Arch Florals)
               ======================================================= -->
          <!-- Left Large Lantern -->
          <g class="lamp-swing-1" filter="url(#softShadow)">
            <line x1="60" y1="190" x2="60" y2="255" stroke="#6e351c" stroke-width="1.2" />
            <use href="#hangingLantern" x="60" y="252" transform="scale(1.06)" style="transform-origin: 60px 252px;" />
          </g>

          <!-- Right Upper Lantern -->
          <g class="lamp-swing-2" filter="url(#softShadow)">
            <line x1="342" y1="190" x2="342" y2="245" stroke="#6e351c" stroke-width="1.1" />
            <use href="#hangingLantern" x="342" y="242" transform="scale(0.88)" style="transform-origin: 342px 242px;" />
          </g>

          <!-- Right Lower Small Lantern -->
          <g class="lamp-swing-3" filter="url(#softShadow)">
            <line x1="378" y1="285" x2="378" y2="338" stroke="#6e351c" stroke-width="1" />
            <use href="#hangingLantern" x="378" y="335" transform="scale(0.68)" style="transform-origin: 378px 335px;" />
          </g>

          <!-- =======================================================
               B. TOP BLUSH PINK SPANDRELS & ORNATE SCALLOPED ARCH
               ======================================================= -->
          <!-- Pastel Blush-Pink Spandrel Fill Above Arch -->
          <path
            d="M 0,0 L 400,0 L 400,225
               C 386,218 378,200 374,178
               C 350,175 335,155 325,130
               C 295,126 276,105 262,82
               C 232,78 212,56 200,32
               C 188,56 168,78 138,82
               C 124,105 105,126 75,130
               C 65,155 50,175 26,178
               C 22,200 14,218 0,225 Z"
            fill="url(#pinkSpandrelGrad)"
          />

          <!-- Soft Watercolor Clouds in Top Pink Corners -->
          <circle cx="45" cy="48" r="55" fill="#f8bbd0" opacity="0.35" />
          <circle cx="355" cy="52" r="60" fill="#f8bbd0" opacity="0.35" />

          <!-- Arch Florals Behind & Over Scalloped Border -->
          <g class="arch-roses-anim" filter="url(#softShadow)">
            <!-- Center Peak Rose Cluster -->
            <use href="#roseLeaves" x="175" y="72" transform="rotate(-145 175 72) scale(1.2)" />
            <use href="#roseLeaves" x="235" y="75" transform="rotate(-25 235 75) scale(1.3)" />
            <use href="#roseLeaves" x="150" y="88" transform="rotate(140 150 88) scale(1.1)" />
            <use href="#crimsonRose" x="155" y="74" transform="scale(0.95)" style="transform-origin: 155px 74px;" />
            <use href="#pinkRose" x="210" y="68" transform="scale(1.25)" style="transform-origin: 210px 68px;" />

  <!-- =========================================================
       JAVASCRIPT: EXTERNAL CONFIG LOADER, GLITTER, AUDIO & MODALS
       ========================================================= -->
  <script>
    // ---------------------------------------------------------
    // 1. EXTERNAL CONFIGURATION (`config.js` / `window.WEDDING_CONFIG`)
    //    All text, links, and `assets/` paths are read from here.
    //    When hosting locally, place this object inside `config.js`
    //    and store photos inside the `assets/` folder:
    //      ├── index.html
    //      ├── config.js
    //      └── assets/
    //          ├── groom.jpg
    //          ├── bride.jpg
    //          ├── venue.jpg
    //          └── calm-music.mp3
    // ---------------------------------------------------------
    window.WEDDING_CONFIG = window.WEDDING_CONFIG || {
      invitationHeaderLine1: "YOU ARE INVITED TO THE",
      invitationHeaderLine2: "WEDDING CEREMONY OF",
      groom: {
        name: "Groom",
        fullName: "Ritesh Mishra",
        role: "The Royal Groom",
        parents: "Son of Mr. Rakesh Mishra & Mrs. Saroj Mishra",
        bio: "A warm-hearted soul who believes in love, laughter, and lifelong adventures.",
        image: "assets/groom.jpg",
        fallbackImage: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=800&q=80"
      },
      wedsText: "Weds",
      bride: {
        name: "Bride",
        fullName: "Pritiksha Mishra",
        role: "The Royal Bride",
        parents: "Daughter of Mr. Mukesh Mishra & Mrs. Pramila Mishra",
        bio: "Graceful, vibrant, and ready to begin a beautiful new chapter together.",
        image: "assets/bride.jpg",
        fallbackImage: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=800&q=80"
      },
      saveTheDateTitle: "Save the Date",
      dateRevealPrompt: "Tap to Reveal the Date",
      weddingDate: "30 NOV | MONDAY | 2026",
      weddingTime: "AT 08.00 PM ONWARDS",
      venueLabel: "VENUE",
      venueName: "Mishra Marriage Lawn ",
      venueAddress: "Bhithuli Crossing, Sitapur Road, Lucknow",
      receptionNote: "Reception to Follow",
      venueDetails: {
        image: "assets/venue.jpg",
        fallbackImage: "https://images.unsplash.com/photo-1519167758481-83f550bb49b3?auto=format&fit=crop&w=1000&q=80",
        description: "Join us at the Mishra Marriage Lawn for an evening of traditional rituals, dinner, and celebration under the stars.",
        googleMapsEmbedUrl: "https://maps.google.com/maps?q=Mishra+Marriage+Lawn,+Crossing,+Sitapur+Rd,+Bhitauli,+Bhitoli+Khurd,+Lucknow,+Uttar+Pradesh+226020&t=&z=16&ie=UTF8&iwloc=&output=embed",
        googleMapsLink: "https://maps.app.goo.gl/8Uii7iwQChFEE1m58"
      },
      music: {
        src: "assets/calm-music.mp3"
      }
    };

    // Populate all DOM text, links, and asset paths from WEDDING_CONFIG
    function renderInvitationFromConfig() {
      const cfg = window.WEDDING_CONFIG;

      // Main Invitation Text
      document.getElementById('headerLine1').textContent = cfg.invitationHeaderLine1;
      document.getElementById('headerLine2').textContent = cfg.invitationHeaderLine2;
      document.getElementById('displayGroomName').textContent = cfg.groom.name;
      document.getElementById('displayWedsText').textContent = cfg.wedsText;
      document.getElementById('displayBrideName').textContent = cfg.bride.name;
      document.getElementById('displaySaveTheDateTitle').textContent = cfg.saveTheDateTitle;
      document.getElementById('displayDateRevealPrompt').textContent = cfg.dateRevealPrompt;
      document.getElementById('displayDateText').textContent = cfg.weddingDate;
      document.getElementById('displayTimeText').textContent = cfg.weddingTime;
      document.getElementById('displayVenueLabel').textContent = cfg.venueLabel;
      document.getElementById('displayVenueName').textContent = cfg.venueName;
      document.getElementById('displayVenueAddress').textContent = cfg.venueAddress;
      document.getElementById('displayReceptionNote').textContent = cfg.receptionNote;

      // Modal Switcher Buttons
      document.getElementById('switchGroomBtn').textContent = `🤵 ${cfg.groom.name}`;
      document.getElementById('switchBrideBtn').textContent = `👰 ${cfg.bride.name}`;

      // Venue Page Details, Image (`assets/venue.jpg`), and Google Maps Links
      const venueImg = document.getElementById('venueHeroImg');
      venueImg.onerror = function () {
        if (this.src !== cfg.venueDetails.fallbackImage) {
          this.src = cfg.venueDetails.fallbackImage;
        }
      };
      venueImg.src = cfg.venueDetails.image;

      document.getElementById('venuePageTitle').textContent = cfg.venueName;
      document.getElementById('venuePageAddress').textContent = cfg.venueAddress;
      document.getElementById('venuePageDescription').textContent = cfg.venueDetails.description;
      document.getElementById('venuePageDate').textContent = cfg.weddingDate;
      document.getElementById('venuePageTime').textContent = `${cfg.weddingTime} • ${cfg.receptionNote}`;
      document.getElementById('googleMapIframe').src = cfg.venueDetails.googleMapsEmbedUrl;
      document.getElementById('googleMapsExternalLink').href = cfg.venueDetails.googleMapsLink;
      document.getElementById('googleMapsBtnBottom').href = cfg.venueDetails.googleMapsLink;
    }

    // ---------------------------------------------------------
    // 2. GROOM & BRIDE CLICKABLE PHOTO MODAL (FROM `assets/`)
    // ---------------------------------------------------------
    function openPersonModal(personKey) {
      const cfg = window.WEDDING_CONFIG;
      const person = cfg[personKey];

      // Play gentle harp chime on tap
      playSparkleChime();

      document.getElementById('modalRoleBadge').textContent = person.role || (personKey === 'groom' ? 'The Royal Groom' : 'The Royal Bride');

      // Load image from `assets/groom.jpg` or `assets/bride.jpg` with fallback
      const imgEl = document.getElementById('modalPersonImg');
      imgEl.onerror = function () {
        if (this.src !== person.fallbackImage) {
          this.src = person.fallbackImage;
        }
      };
      imgEl.src = person.image;

      document.getElementById('modalPersonName').textContent = person.name;
      document.getElementById('modalPersonFullName').textContent = person.fullName || '';
      document.getElementById('modalPersonParents').textContent = person.parents;
      document.getElementById('modalPersonBio').textContent = person.bio;

      // Highlight active switcher pill
      const groomBtn = document.getElementById('switchGroomBtn');
      const brideBtn = document.getElementById('switchBrideBtn');
      if (personKey === 'groom') {
        groomBtn.className = 'px-3.5 py-1.5 rounded-full text-xs font-bold transition bg-rose-600 text-white border border-rose-600 shadow-sm';
        brideBtn.className = 'px-3.5 py-1.5 rounded-full text-xs font-semibold transition bg-white text-slate-700 border border-slate-200 hover:bg-rose-50';
      } else {
        brideBtn.className = 'px-3.5 py-1.5 rounded-full text-xs font-bold transition bg-rose-600 text-white border border-rose-600 shadow-sm';
        groomBtn.className = 'px-3.5 py-1.5 rounded-full text-xs font-semibold transition bg-white text-slate-700 border border-slate-200 hover:bg-rose-50';
      }

      const modal = document.getElementById('personModal');
      const card = document.getElementById('personModalCard');
      modal.classList.remove('hidden');
      modal.classList.add('flex');

      requestAnimationFrame(() => {
        card.classList.remove('scale-95', 'opacity-0');
        card.classList.add('scale-100', 'opacity-100');
      });
    }

    function closePersonModal() {
      const modal = document.getElementById('personModal');
      const card = document.getElementById('personModalCard');
      card.classList.remove('scale-100', 'opacity-100');
      card.classList.add('scale-95', 'opacity-0');
      setTimeout(() => {
        modal.classList.remove('flex');
        modal.classList.add('hidden');
      }, 220);
    }

    function closePersonModalOnBackdrop(e) {
      if (e.target.id === 'personModal') {
        closePersonModal();
      }
    }

    // ---------------------------------------------------------
    // 3. CUTE DATE REVEAL ANIMATION
    // ---------------------------------------------------------
    function revealWeddingDate(event) {
      const cover = document.getElementById('dateRevealCover');
      const content = document.getElementById('dateRevealedContent');

      // Burst golden glitter & rose petals at click position
      const rect = document.getElementById('phoneScreen').getBoundingClientRect();
      const clickX = event ? (event.clientX - rect.left) : rect.width / 2;
      const clickY = event ? (event.clientY - rect.top) : 475;
      spawnCelebrationBurst(clickX, clickY, 42);

      // Play auspicious chime
      playSparkleChime();

      // Auto-start calm background music on first interaction if not already started
      if (!isMusicPlaying && !userManuallyMuted) {
        startCalmMusic();
      }

      // Animate cover out & date in
      cover.style.transform = 'scale(1.12) translateY(-10px)';
      cover.style.opacity = '0';
      cover.style.pointerEvents = 'none';

      content.classList.remove('opacity-0', 'scale-90', 'pointer-events-none');
      content.classList.add('opacity-100', 'scale-100');
    }

    function resetDateReveal(event) {
      if (event) event.stopPropagation();
      const cover = document.getElementById('dateRevealCover');
      const content = document.getElementById('dateRevealedContent');

      content.classList.remove('opacity-100', 'scale-100');
      content.classList.add('opacity-0', 'scale-90', 'pointer-events-none');

      cover.style.transform = '';
      cover.style.opacity = '1';
      cover.style.pointerEvents = 'auto';
    }

    // ---------------------------------------------------------
    // 4. CLICKABLE VENUE PAGE & GOOGLE MAPS
    // ---------------------------------------------------------
    function openVenuePage() {
      playSparkleChime();
      const venuePage = document.getElementById('venuePage');
      venuePage.classList.remove('translate-x-full');
      venuePage.classList.add('translate-x-0');
    }

    function closeVenuePage() {
      const venuePage = document.getElementById('venuePage');
      venuePage.classList.remove('translate-x-0');
      venuePage.classList.add('translate-x-full');
    }

    // ---------------------------------------------------------
    // 5. INTERACTIVE LOVEBIRDS HEART BURST
    // ---------------------------------------------------------
    function triggerBirdChirp(event) {
      const container = document.getElementById('birdHeartContainer');
      const symbols = ['💗', '🎵', '🌸', '✨', '💕'];
      for (let i = 0; i < 4; i++) {
        const el = document.createElement('span');
        el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        el.className = 'absolute text-xs select-none pointer-events-none transition-all duration-1000 ease-out';
        el.style.left = (25 + Math.random() * 45) + 'px';
        el.style.top = (25 + Math.random() * 35) + 'px';
        el.style.opacity = '1';
        container.appendChild(el);

        requestAnimationFrame(() => {
          el.style.transform = `translate(${(Math.random() - 0.3) * 45}px, -${40 + Math.random() * 35}px) scale(1.3)`;
          el.style.opacity = '0';
        });

        setTimeout(() => el.remove(), 1000);
      }
      playBirdSweetNote();
    }

    // ---------------------------------------------------------
    // 6. CONTINUOUS GLITTER & SPARKLE ANIMATION (HTML5 CANVAS)
    // ---------------------------------------------------------
    const canvas = document.getElementById('glitterCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let burstParticles = [];

    function resizeGlitterCanvas() {
      const screen = document.getElementById('phoneScreen');
      canvas.width = screen.clientWidth;
      canvas.height = screen.clientHeight;
    }

    function createGlitterParticle() {
      const colors = ['#ffd700', '#ffecb3', '#fff8e1', '#f8bbd0', '#ffca28'];
      return {
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: 1.2 + Math.random() * 2.6,
        speedY: 0.18 + Math.random() * 0.42,
        speedX: (Math.random() - 0.5) * 0.3,
        alpha: Math.random(),
        alphaSpeed: 0.012 + Math.random() * 0.025,
        color: colors[Math.floor(Math.random() * colors.length)],
        isStar: Math.random() > 0.45,
        rotation: Math.random() * Math.PI * 2
      };
    }

    function spawnCelebrationBurst(x, y, count = 30) {
      const burstColors = ['#ffd700', '#e91e63', '#ff80ab', '#ffca28', '#ffffff'];
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.2 + Math.random() * 4.2;
        burstParticles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.2,
          size: 2 + Math.random() * 3.5,
          alpha: 1,
          color: burstColors[Math.floor(Math.random() * burstColors.length)],
          isPetal: Math.random() > 0.5
        });
      }
    }

    function drawFourPointSparkle(cx, cy, outerR, color, alpha, rotation) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rotation);
      ctx.beginPath();
      const innerR = outerR * 0.32;
      for (let i = 0; i < 4; i++) {
        const angle = (i * Math.PI) / 2;
        ctx.lineTo(Math.cos(angle) * outerR, Math.sin(angle) * outerR);
        const midAngle = angle + Math.PI / 4;
        ctx.lineTo(Math.cos(midAngle) * innerR, Math.sin(midAngle) * innerR);
      }
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
      ctx.shadowColor = '#ffd700';
      ctx.shadowBlur = 6;
      ctx.fill();
      ctx.restore();
    }

    function animateGlitter() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Ambient continuous glitter
      for (let p of particles) {
        p.y += p.speedY;
        p.x += p.speedX + Math.sin(p.y * 0.02) * 0.15;
        p.alpha += p.alphaSpeed;
        p.rotation += 0.01;

        if (p.alpha >= 1 || p.alpha <= 0.1) {
          p.alphaSpeed = -p.alphaSpeed;
        }
        if (p.y > canvas.height + 10) {
          p.y = -10;
          p.x = Math.random() * canvas.width;
        }

        if (p.isStar) {
          drawFourPointSparkle(p.x, p.y, p.size * 1.9, p.color, p.alpha * 0.85, p.rotation);
        } else {
          ctx.save();
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = Math.max(0, Math.min(1, p.alpha * 0.75));
          ctx.shadowColor = '#ffecb3';
          ctx.shadowBlur = 4;
          ctx.fill();
          ctx.restore();
        }
      }

      // Interactive celebration burst particles
      for (let i = burstParticles.length - 1; i >= 0; i--) {
        const b = burstParticles[i];
        b.x += b.vx;
        b.y += b.vy;
        b.vy += 0.08; // gentle gravity
        b.alpha -= 0.018;

        if (b.alpha <= 0) {
          burstParticles.splice(i, 1);
          continue;
        }

        if (b.isPetal) {
          ctx.save();
          ctx.translate(b.x, b.y);
          ctx.fillStyle = b.color;
          ctx.globalAlpha = b.alpha;
          ctx.beginPath();
          ctx.ellipse(0, 0, b.size * 1.3, b.size * 0.75, b.vx * 0.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        } else {
          drawFourPointSparkle(b.x, b.y, b.size * 1.8, b.color, b.alpha, b.vx);
        }
      }

      requestAnimationFrame(animateGlitter);
    }

    // Spawn gentle sparkle burst wherever user taps on the screen
    document.getElementById('phoneScreen').addEventListener('pointerdown', (e) => {
      const rect = document.getElementById('phoneScreen').getBoundingClientRect();
      spawnCelebrationBurst(e.clientX - rect.left, e.clientY - rect.top, 8);
    });

    // ---------------------------------------------------------
    // 8. CALM BACKGROUND MUSIC (WEB AUDIO SANTOOR/FLUTE + MP3)
    // ---------------------------------------------------------
    let audioCtx = null;
    let isMusicPlaying = false;
    let userManuallyMuted = false;
    let melodyInterval = null;
    let customAudioElement = null;

    // Soothing pentatonic Raga Desh / Yaman inspired frequencies (Hz)
    const calmNotes = [
      261.63, // Sa (C4)
      293.66, // Re (D4)
      329.63, // Ga (E4)
      392.00, // Pa (G4)
      440.00, // Dha (A4)
      523.25, // Sa' (C5)
      587.33, // Re' (D5)
      659.25  // Ga' (E5)
    ];

    const sereneMelodySequence = [0, 2, 3, 5, 4, 3, 2, 1, 0, 3, 4, 5, 6, 5, 3, 2];
    let noteIndex = 0;

    function initAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playCalmSantoorNote(freq, duration = 2.6, volume = 0.07) {
      if (!audioCtx || !isMusicPlaying) return;
      const now = audioCtx.currentTime;

      // Main warm sine + soft triangle harmonic (Santoor / Harp timbre)
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(freq, now);

      osc2.type = 'triangle';
      osc2.frequency.setValueAtTime(freq * 2, now); // soft octave harmonic

      const harmonicGain = audioCtx.createGain();
      harmonicGain.gain.setValueAtTime(0.15, now);

      gainNode.gain.setValueAtTime(0.001, now);
      gainNode.gain.linearRampToValueAtTime(volume, now + 0.18);
      gainNode.gain.exponentialRampToValueAtTime(0.0008, now + duration);

      osc1.connect(gainNode);
      osc2.connect(harmonicGain);
      harmonicGain.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + duration);
      osc2.stop(now + duration);
    }

    function playSparkleChime() {
      try {
        initAudioContext();
        const now = audioCtx.currentTime;
        const chimeNotes = [523.25, 659.25, 783.99, 1046.5];
        chimeNotes.forEach((f, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, now + idx * 0.06);
          gain.gain.setValueAtTime(0.001, now + idx * 0.06);
          gain.gain.linearRampToValueAtTime(0.045, now + idx * 0.06 + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0008, now + idx * 0.06 + 0.7);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.06);
          osc.stop(now + idx * 0.06 + 0.75);
        });
      } catch (e) {}
    }

    function playBirdSweetNote() {
      try {
        initAudioContext();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1174.66, now);
        osc.frequency.exponentialRampToValueAtTime(1567.98, now + 0.14);
        gain.gain.setValueAtTime(0.04, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.26);
      } catch (e) {}
    }

    function updateMusicUI(playing) {
      const textEl = document.getElementById('musicStatusText');
      const bar1 = document.getElementById('bar1');
      const bar2 = document.getElementById('bar2');
      const bar3 = document.getElementById('bar3');

      if (playing) {
        textEl.textContent = 'Music On';
        bar1.classList.add('eq-bar-1');
        bar2.classList.add('eq-bar-2');
        bar3.classList.add('eq-bar-3');
      } else {
        textEl.textContent = 'Music Off';
        bar1.classList.remove('eq-bar-1');
        bar2.classList.remove('eq-bar-2');
        bar3.classList.remove('eq-bar-3');
      }
    }

    function startSynthesizedCalmMelody() {
      initAudioContext();
      // Play initial warm Tanpura drone + melody note immediately
      playCalmSantoorNote(130.81, 4.5, 0.04); // Bass Sa drone
      playCalmSantoorNote(calmNotes[sereneMelodySequence[noteIndex]], 2.8, 0.065);

      if (melodyInterval) clearInterval(melodyInterval);
      melodyInterval = setInterval(() => {
        if (!isMusicPlaying) return;
        noteIndex = (noteIndex + 1) % sereneMelodySequence.length;
        const freq = calmNotes[sereneMelodySequence[noteIndex]];
        playCalmSantoorNote(freq, 2.8, 0.065);

        // Soft tanpura drone every 4 notes
        if (noteIndex % 4 === 0) {
          playCalmSantoorNote(130.81, 4.8, 0.035);
          playCalmSantoorNote(196.00, 4.8, 0.025);
        }
      }, 1150);
    }

    function startCalmMusic() {
      isMusicPlaying = true;
      updateMusicUI(true);

      const configuredAudioSrc = window.WEDDING_CONFIG?.music?.src;
      if (configuredAudioSrc && !customAudioElement) {
        const audio = new Audio(configuredAudioSrc);
        audio.loop = true;
        audio.volume = 0.5;
        audio.onerror = function () {
          // If assets/calm-music.mp3 is not present on disk, fallback to calm Santoor melody
          customAudioElement = null;
          if (isMusicPlaying) startSynthesizedCalmMelody();
        };
        customAudioElement = audio;
      }

      if (customAudioElement) {
        customAudioElement.play().catch(() => {
          customAudioElement = null;
          startSynthesizedCalmMelody();
        });
        return;
      }

      startSynthesizedCalmMelody();
    }

    function stopCalmMusic() {
      isMusicPlaying = false;
      updateMusicUI(false);
      if (melodyInterval) {
        clearInterval(melodyInterval);
        melodyInterval = null;
      }
      if (customAudioElement) {
        customAudioElement.pause();
      }
    }

    function toggleCalmMusic() {
      if (isMusicPlaying) {
        userManuallyMuted = true;
        stopCalmMusic();
      } else {
        userManuallyMuted = false;
        startCalmMusic();
      }
    }

    // ---------------------------------------------------------
    // 8. INITIALIZATION ON WINDOW LOAD
    // ---------------------------------------------------------
    window.onload = function () {
      // Populate all text, links, and assets/ image paths from config
      renderInvitationFromConfig();

      resizeGlitterCanvas();
      window.addEventListener('resize', resizeGlitterCanvas);

      // Create 42 floating golden & pink fairy-dust glitter particles
      particles = [];
      for (let i = 0; i < 42; i++) {
        particles.push(createGlitterParticle());
      }
      animateGlitter();

      startCalmMusic();
      document.addEventListener('pointerdown', initAudioContext, { once: true });
      document.addEventListener('keydown', initAudioContext, { once: true });
    };
  </script>
